pathItem:
  post:
    summary: Отправка номенклатуры сырья и материалов (мастер по номенклатуре - Fabix)
    x-use:
      - Магнит
      - Рязань
    x-source: "ISF"
    x-recipient: "ИС Заказчика"
    description: |
      Отправляет в ИС Заказчика номенклаттуру сырья
      # Заголовок первого уровня (H1)

      Это пример абзаца обычного текста в Markdown. Текст может быть **жирным** для выделения важных мыслей или *курсивным*, если нужно подчеркнуть слово. Если вы допустили ошибку, текст можно ~~зачеркнуть~~.

      ## Подзаголовок второго уровня (H2)

      Здесь мы рассмотрим использование различных видов списков и цитат.

      ### Списки и цитаты (H3)

      * **Маркированный список:**
      * Элемент первого уровня
      * Еще один элемент
         * Вложенный элемент второго уровня
      * **Простой формат:** Каждый пункт логически продолжает общую тему.

      1. **Нумерованный список:** Используется для последовательных шагов.
      2. **Второй шаг:** Порядок имеет значение.
      3. **Третий шаг:** Завершение процесса.

      > **Важное примечание:** Маркдаун позволяет форматировать текст прямо во время написания, не отвлекаясь на сложные графические редакторы.

      ---

      ### Ссылки и код (H3)

      Вы можете вставлять [полезные ссылки](https://example.com) или выделять `короткие команды` прямо внутри строки текста.
    tags:
      - НСИ
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rawNomenclature
            properties:
              rawNomenclature:
                $ref: '#/components/schemas/rawNomenclature'
    responses:
      '200':
        description: Результат обработки (успешный или неуспешный)
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../components/okResponse.yaml'
                - $ref: '../components/errorResponse.yaml'         
components:
  schemas:
    RawNomenclatureRequest:
      type: object
      description: Тело запроса на отправку номенклатуры сырья.
      required:
        - product
      properties:
        product:
          $ref: "#/components/schemas/product"

    product:
      type: object
      description: Номенклатура сырья.
      required:
        - id
        - article
        - name
        - unit
        - isMercury
        - isInActive
        - origin
        - expireControl
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор номенклатуры.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: поле guid записи номенклатуры.
        article:
          type: string
          description: Артикул.
          example: СЫР-000123
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Артикул.
        name:
          type: string
          description: Наименование.
          example: Мука пшеничная высшего сорта
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Наименование.
        unit:
          type: string
          description: |
            Единица измерения. Производственная единица измерения, значение из перечисления
            «Производственные единицы измерения», переведённое в значение из ОКЕИ
            (Общероссийский классификатор единиц измерения):
            - `KGM` — килограмм
            - `PCE` — штука
            - `LTR` — литр
            - `MTR` — метр
            - `GRM` — грамм
          enum:
            - KGM
            - PCE
            - LTR
            - MTR
            - GRM
          example: KGM
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
        isMercury:
          type: boolean
          description: "`true`, если продукция подотчётна Меркурию."
          example: false
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Подотчётная Меркурию продукция.
        isInActive: 
          type: boolean
          description: |
            Признак архивации.
            - При отправке сообщения по кнопке «Утвердить» — `isInActive = false`.
            - При отправке сообщения по кнопке «В архив» — `isInActive = true`.
            - При отправке сообщения после приёма номенклатуры СиМ — значение, установленное при приёме.
          example: false
        category:
          $ref: "#/components/schemas/category"
        origin:
          type: string
          description: Происхождение.
          enum:
            - Растительное
            - Животное
            - Комбинированное
            - Другое
          example: Растительное
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Происхождение.
        expireControl:
          type: boolean
          description: Контролировать срок годности.
          example: true
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Контролировать срок годности.
        dateIns:
          type: string
          format: date-time
          description: Дата создания записи. Строка в текстовом формате RFC 3339.
          example: "2026-09-01T09:15:30+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
          # Источник — атрибут: Дата создания записи.
        dateUpd:
          type: string
          format: date-time
          description: |
            Дата последнего изменения, инициировавшего обмен.
            Строка в текстовом формате RFC 3339.
          example: "2026-09-08T15:37:12+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
        dateDel:
          type: string
          format: date-time
          description: Дата удаления записи. Строка в текстовом формате RFC 3339.
          example: "2026-09-21T10:05:00+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
          # Источник — атрибут: Дата удаления записи.

    category:
      type: object
      description: |
        Категория. Необязательный объект; если он передан, то `id` и `name` обязательны.
      # Источник — сущность: Номенклатура сырья, общая часть карточки.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор категории.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          # Источник — идентификатор справочника «Категории сырья».
        name:
          type: string
          description: Наименование категории.
          example: Мука и крупы
          # Источник — наименование справочника «Категории сырья».