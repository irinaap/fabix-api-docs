<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Swagger UI in iframe</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { padding: 8px 16px; background: #1b1b1b; color: #fff; }
    iframe { display: block; width: 100%; height: calc(100vh - 36px); border: 0; }
  </style>
</head>
<body>
  <header>Host page</header>
  <iframe src="api-docs/?spec=Petstore%20(OpenAPI%203)" title="API documentation"></iframe>
</body>
</html>
