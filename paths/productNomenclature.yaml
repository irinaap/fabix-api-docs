pathItem:
  post:
    summary: Отправка номенклатуры ГП, ПФ (мастер по номенклатуре ПФ/ГП - ISF)
    operationId: sendProductNomenclature
    x-source: "ISF (АРМ Офис)"
    x-recipient:
      - АРМ Склад
      - ИС Заказчика
    description: |
      Отправляет данные справочника «Номенклатура ГП, ПФ» из АРМ Офис в АРМ Склад и/или в ИС Заказчика.

      Интеграционные потоки включены, если значение настройки конфигурации
      **Мастер-система по номенклатуре ПФ/ГП** = `ISF`.

      ## Сценарии взаимодействия
      - **АРМ Склад на стороне ISF.** Справочник создаётся и редактируется в АРМ Офис
        и отправляется в АРМ Склад и в ИС Заказчика.
      - **АРМ Склад на стороне ИС Заказчика.** Справочник создаётся и редактируется в АРМ Офис
        и отправляется в ИС Заказчика.

      В процессе отправки и получения ответов система изменяет статусы отправляемой записи в АРМ Офис.

      ## Инициация обмена
      - по нажатию кнопки **Утвердить** / **Повторить отправку** в карточке Техкарты в АРМ Офис;
      - по нажатию кнопки **В архив** в карточке Техкарты в АРМ Офис;
      - по нажатию кнопки **Ок** при индивидуальном/массовом редактировании записей в Реестре номенклатуры ГП-ПФ.

      Данные номенклатуры **не отправляются** для выпускаемого продукта, если Тип = ПФ
      и ограничение = «Нельзя хранить».

      ## Endpoint
      **Склад на стороне ИС Заказчика:** endpoint указан в настройке
      Номенклатура -> Справочник Номенклатура ГП, ПФ (в склад).

      **Склад на стороне ISF:**
      - endpoint для отправки в склад указан в настройке
        Номенклатура -> Справочник Номенклатура ГП, ПФ (в склад),
        определён в системе как `[url АРМ Склад]/api/integrations/nomenclature/products`;
      - endpoint для отправки в ИС Заказчика указан в настройке
        Номенклатура -> Справочник Номенклатура ГП, ПФ (в бухгалтерию).

      ## Состав выгрузки в ИС Заказчика
      Определяется настройкой конфигурации **Выгрузка номенклатуры ГП и ПФ**:
      - `только ГП` — в ИС Заказчика отправляется только номенклатура ГП;
      - `ПФ и ГП` — в ИС Заказчика отправляется номенклатура ГП и ПФ.

      ## Обработка архивации на стороне АРМ Склад (`isInActive = true`)
      1. Проверить, существует ли в таблице Номенклатура ГП-ПФ (`product_nomenclatures`)
         запись, у которой идентификатор = `id`.
         - Если нет — ответ `200 OK`, `success = true`, `error = null`.
      2. Если да — проверить, существуют ли записи в таблице Запасы, где
         статус = Доступно / Бронь / Брак, Количество > 0, ID партии = Партии -> ID,
         где Партии -> Номенклатура ГП-ПФ -> ID = `id`.
         - Если нет — установить записи в таблице Номенклатура ГП-ПФ (идентификатор = `id`)
           Признак активности = `false`, Дата удаления = текущая дата-время;
           ответ `200 OK`, `success = true`, `error = null`.
         - Если да — ответ `200 OK`, `success = false`, ошибка `020`
           (Архивация номенклатуры невозможна).
    tags:
      - НСИ
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/productNomenclatureRequest'
          examples:
            finishedProduct:
              summary: Готовая продукция (ГП)
              value:
                product:
                  id: 9b2f4c1e-6d3a-4f8b-a1c7-2e5d8f0b3a41
                  article: ГП-000457
                  name: Салат «Оливье» с курицей, 250 г
                  unit: PCE
                  quantumProduction: "120.000"
                  quantumShipment: "12.00"
                  estimatedMass: "0.250"
                  ownBrand:
                    id: 0f8c3a2d-1b4e-4c6a-9d7f-5e2a1c3b4d5e
                    name: Вкусно каждый день
                  shelfLife:
                    count: 72
                    unit: HUR
                  isFinished: true
                  mercury: null
                  barcode: "4601234567893"
                  productGroup:
                    id: 5a1d2e3f-4b5c-4d6e-8f7a-9b0c1d2e3f4a
                    name: Салаты
                  dishType:
                    id: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                    name: Холодные закуски
                  isHonestSign: false
                  isInActive: false
                  dateIns: "2026-09-01T09:15:30+03:00"
                  dateUpd: "2026-09-08T15:37:12+03:00"
            semiFinishedProduct:
              summary: Полуфабрикат (ПФ)
              value:
                product:
                  id: 2e7a9c4b-8f1d-4a3e-b6c5-7d0e1f2a3b4c
                  article: ПФ-000112
                  name: Курица отварная, филе, кубик 10 мм
                  unit: KGM
                  quantumProduction: "25.500"
                  shelfLife:
                    count: 48
                    unit: HUR
                  isFinished: false
                  mercury: null
                  isHonestSign: false
                  isInActive: false
                  dateIns: "2026-08-20T11:02:45+03:00"
                  dateUpd: "2026-09-05T08:40:00+03:00"
            archiving:
              summary: Архивация номенклатуры (кнопка «В архив»)
              value:
                product:
                  id: 9b2f4c1e-6d3a-4f8b-a1c7-2e5d8f0b3a41
                  article: ГП-000457
                  name: Салат «Оливье» с курицей, 250 г
                  unit: PCE
                  shelfLife:
                    count: 72
                    unit: HUR
                  isFinished: true
                  mercury: null
                  isHonestSign: false
                  isInActive: true
                  dateIns: "2026-09-01T09:15:30+03:00"
                  dateUpd: "2026-09-21T10:05:00+03:00"
                  dateDel: "2026-09-21T10:05:00+03:00"
    responses:
      '200':
        description: |
          Результат обработки (успешный или неуспешный).
          `id` — идентификатор номенклатуры, полученный в запросе (ранее — `productId`);
          не возвращается, если код ошибки 4XX.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../components/okResponse.yaml'
                - $ref: '../components/errorResponse.yaml'
            examples:
              success:
                summary: Успешная обработка
                value:
                  id: 9b2f4c1e-6d3a-4f8b-a1c7-2e5d8f0b3a41
                  success: true
                  error: null
              archiveImpossible:
                summary: Архивация невозможна — есть запасы
                value:
                  id: 9b2f4c1e-6d3a-4f8b-a1c7-2e5d8f0b3a41
                  success: false
                  error:
                    - code: "020"
                      description: Архивация номенклатуры невозможна

components:
  schemas:
    productNomenclatureRequest:
      type: object
      description: Тело запроса на отправку номенклатуры ГП, ПФ.
      required:
        - product
      properties:
        product:
          $ref: '#/components/schemas/productNomenclature'

    productNomenclature:
      type: object
      description: Номенклатура готовой продукции (ГП) / полуфабриката (ПФ).
      required:
        - id
        - article
        - name
        - unit
        - shelfLife
        - isFinished
        - isHonestSign
        - isInActive
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор номенклатуры.
          example: 9b2f4c1e-6d3a-4f8b-a1c7-2e5d8f0b3a41
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: поле guid записи номенклатуры.
        article:
          type: string
          description: Артикул.
          example: ГП-000457
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: Артикул.
        name:
          type: string
          description: Наименование.
          example: Салат «Оливье» с курицей, 250 г
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: Выпускаемый продукт.
        unit:
          type: string
          description: |
            Наименование единицы измерения. Единица измерения выхода — значение из перечисления
            «Производственные единицы измерения», переведённое в значение из ОКЕИ
            (Общероссийский классификатор единиц измерения):
            - `KGM` — килограмм
            - `PCE` — штука
          enum:
            - KGM
            - PCE
          example: PCE
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: Единица измерения выхода.
        quantumProduction:
          type: string
          format: numeric(10,3)
          pattern: '^\d{1,7}(\.\d{1,3})?$'
          description: Квант выпуска. Число в строковом формате, numeric(10,3).
          example: "120.000"
          # Источник — сущность: Техкарта номенклатуры ГП.
          # Источник — атрибут: Выход.
        quantumShipment:
          type: string
          format: numeric(10,2)
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Квант заказа. Число в строковом формате, numeric(10,2).
          example: "12.00"
          # Источник — сущность: Техкарта номенклатуры ГП.
          # Источник — атрибут: Квант заказа.
        estimatedMass:
          type: string
          format: numeric(5,3)
          pattern: '^\d{1,2}(\.\d{1,3})?$'
          description: Оценочный вес 1 шт., кг. Число в строковом формате, numeric(5,3).
          example: "0.250"
          # Источник — сущность: Техкарта номенклатуры ГП.
          # Источник — атрибут: Оценочный вес 1 шт., кг.
        ownBrand:
          $ref: '#/components/schemas/ownBrand'
        shelfLife:
          $ref: '#/components/schemas/shelfLife'
        isFinished:
          type: boolean
          description: |
            Признак готовой продукции:
            - `true` — готовая продукция (Тип = ГП);
            - `false` — полуфабрикат (Тип = ПФ).
          example: true
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: Тип (ГП -> true, ПФ -> false).
        mercury:
          $ref: '#/components/schemas/mercury'
        barcode:
          type: string
          description: Штрихкод (EAN13, ITF14).
          pattern: '^(\d{13}|\d{14})$'
          example: "4601234567893"
          # Источник — сущность: Выпускаемый продукт Техкарты.
          # Источник — атрибут: Штрихкод.
        productGroup:
          $ref: '#/components/schemas/productGroup'
        dishType:
          $ref: '#/components/schemas/dishType'
        isHonestSign:
          type: boolean
          description: Продукция подконтрольна Честному знаку.
          example: false
          # Источник — сущность: Выпускаемый продукт Техкарты.
        isInActive:
          type: boolean
          description: |
            Признак архивации.
            - `false`, если в списке техкарт, связанных с номенклатурой
              (Выпускаемый продукт -> Базовая техкарта -> Техкарта),
              существует запись со статусом `APPROVED`;
            - `true`, если в списке техкарт, связанных с номенклатурой,
              не существует ни одной записи со статусом `APPROVED`.
          example: false
          # Источник — сущность: Выпускаемый продукт Техкарты -> Базовая техкарта -> Техкарта.
        dateIns:
          type: string
          format: date-time
          description: Дата создания. Строка в текстовом формате RFC 3339.
          example: "2026-09-01T09:15:30+03:00"
          # Источник — сущность: Лог изменений номенклатуры ГП.
          # Источник — атрибут: Дата создания.
        dateUpd:
          type: string
          format: date-time
          description: Дата последнего изменения. Строка в текстовом формате RFC 3339.
          example: "2026-09-08T15:37:12+03:00"
          # Источник — сущность: Лог изменений номенклатуры ГП.
          # Источник — атрибут: Дата последнего изменения.
        dateDel:
          type: string
          format: date-time
          description: Дата удаления. Строка в текстовом формате RFC 3339.
          example: "2026-09-21T10:05:00+03:00"
          # Источник — сущность: Лог изменений номенклатуры ГП.
          # Источник — атрибут: Дата удаления.

    ownBrand:
      type: object
      description: |
        Собственная торговая марка (СТМ). Только для ГП — заполняется, только если Тип = ГП.
        Необязательный объект; если он передан, то `id` и `name` обязательны.
      # Источник — сущность: Справочник СТМ.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор СТМ.
          example: 0f8c3a2d-1b4e-4c6a-9d7f-5e2a1c3b4d5e
          # Источник — идентификатор справочника СТМ.
        name:
          type: string
          description: Наименование СТМ.
          example: Вкусно каждый день
          # Источник — сущность: Справочник СТМ.
          # Источник — атрибут: Собственная торговая марка.

    shelfLife:
      type: object
      description: Срок годности.
      # Источник — сущность: Техкарта номенклатуры ГП.
      required:
        - count
        - unit
      properties:
        count:
          type: integer
          format: int32
          description: Срок годности, количество.
          example: 72
          # Источник — атрибут: Срок годности, кол-во.
        unit:
          type: string
          description: |
            Срок годности, единица измерения. Значение из перечисления
            «Единицы измерения времени», переведённое в значение из ОКЕИ
            (Общероссийский классификатор единиц измерения):
            - `MIN` — минута
            - `HUR` — час
            - `DAY` — сутки
            - `MON` — месяц
          enum:
            - MIN
            - HUR
            - DAY
            - MON
          example: HUR
          # Источник — атрибут: Срок годности, ЕИ.

    mercury:
      type: object
      nullable: true
      description: |
        Сведения о регистрации номенклатуры в Меркурии.
        Заполняется, только если «Подотчётная Меркурию продукция» = `true`.

        **Атрибуты объекта `mercury` не заполняются, объект отправляется пустым.**
        Отправлять данные потребуется после разработки интеграции с Меркурием.
      # Источник — сущность: Техкарта номенклатуры ГП.
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор продукции в Меркурии.
          example: 6f1e2d3c-4b5a-4968-8776-5a4b3c2d1e0f
          # Источник — сущность: Номенклатура ГП, Данные из Меркурия.
          # Источник — атрибут: Guid.
        packagingType:
          $ref: '#/components/schemas/mercuryPackagingType'
        quantity:
          type: integer
          format: int32
          description: Количество единиц упаковки.
          example: 10
          # Источник — сущность: Номенклатура ГП, Данные из Меркурия.
          # Источник — атрибут: Количество единиц упаковки.
        volume:
          type: string
          format: numeric(10,2)
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Объём единицы упаковки товара. Число в строковом формате, numeric(10,2).
          example: "0.25"
          # Источник — сущность: Номенклатура ГП, Данные из Меркурия.
          # Источник — атрибут: Объём единицы упаковки товара.
        unit:
          $ref: '#/components/schemas/mercuryUnit'

    mercuryPackagingType:
      type: object
      description: Тип упаковки.
      # Источник — сущность: Справочник Виды упаковки.
      properties:
        id:
          type: string
          format: uuid
          description: Глобальный идентификатор упаковки.
          example: 8a7b6c5d-4e3f-4a1b-9c8d-7e6f5a4b3c2d
          # Источник — атрибут: Guid упаковки.
        code:
          type: string
          description: Уникальный идентификатор упаковки.
          example: BX
          # Источник — атрибут: Код.

    mercuryUnit:
      type: object
      description: Единица измерения объёма единицы упаковки товара.
      # Источник — сущность: Номенклатура ГП, Данные из Меркурия.
      properties:
        id:
          type: string
          format: uuid
          description: Глобальный идентификатор единицы измерения.
          example: 1d2c3b4a-5f6e-4d7c-8b9a-0f1e2d3c4b5a
          # Источник — атрибут: Глобальный идентификатор единицы измерения.
        name:
          type: string
          description: Наименование единицы измерения.
          example: кг
          # Источник — атрибут: Наименование единицы измерения.

    productGroup:
      type: object
      description: |
        Группа продуктов. Только для ГП — заполняется, только если Тип = ГП.
        Необязательный объект; если он передан, то `id` и `name` обязательны.
      # Источник — сущность: Техкарта номенклатуры ГП.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор группы продуктов.
          example: 5a1d2e3f-4b5c-4d6e-8f7a-9b0c1d2e3f4a
          # Источник — идентификатор справочника «Группа продуктов».
        name:
          type: string
          description: Наименование группы продуктов.
          example: Салаты
          # Источник — сущность: Справочник «Группа продуктов».

    dishType:
      type: object
      description: |
        Тип блюда. Только для ГП — заполняется, только если Тип = ГП.
        Необязательный объект; если он передан, то `id` и `name` обязательны.
      # Источник — сущность: Техкарта номенклатуры ГП.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор типа блюда.
          example: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
          # Источник — идентификатор справочника «Типы готовых блюд».
        name:
          type: string
          description: Наименование типа блюда.
          example: Холодные закуски
          # Источник — сущность: Справочник «Типы готовых блюд».
