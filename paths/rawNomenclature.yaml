pathItem:
  post:
    summary: Отправка номенклатуры сырья (мастер по номенклатуре СиМ - Fabix)
    x-source: "ISF (АРМ Офис)"
    x-recipient:
      - АРМ Склад
      - ИС Заказчика
    x-use:
      - Магнит
      - Рязань
    description: |
      Справочник «Номенклатура сырья» создаётся и редактируется в АРМ Офис и отправляется в АРМ Склад и/или в ИС Заказчика.

      ## Условия включения потоков
      Поток отправки **в АРМ Склад** включен, если:
      - значение настройки конфигурации **Мастер-система по производственной номенклатуре СиМ** = `ISF`, или
      - значение настройки конфигурации **Мастер-система по производственной номенклатуре СиМ** = `Внешняя система`
        и значение системной настройки **Интеграция с Айко** = `true`
        (номенклатура принимается интеграцией из внешней ИС в АРМ Офис и отправляется в АРМ Склад).

      Поток отправки **в ИС Заказчика** включен, если значение настройки конфигурации
      **Мастер-система по производственной номенклатуре СиМ** = `ISF`.

      ## Инициация обмена
      - по нажатию кнопки **Утвердить** в карточке Номенклатуры сырья в АРМ Офис (`isInActive = false`);
      - по нажатию кнопки **В архив** в карточке Номенклатуры сырья в АРМ Офис (`isInActive = true`);
      - при приёме номенклатуры СиМ, если значение системной настройки **Интеграция с Айко** = `true`
        (`isInActive` = значению, установленному при приёме).

      В процессе отправки и получения ответов система изменяет статусы отправляемой записи в АРМ Офис.

      ## Повторная отправка
      При повторной отправке (Синхронизация со складской системой = Ошибка или Синхронизация с бухгалтерией = Ошибка)
      потоки отправки зависят от статуса номенклатуры:

      | Статус номенклатуры | Отправка в АРМ Склад | Отправка в ИС Заказчика |
      |---------------------|----------------------|-------------------------|
      | Архив               | нет                  | да                      |
      | Переводится в Архив | да                   | да                      |
      | Используется        | да, если Синхронизация со складской системой = Ошибка | да, если Синхронизация с бухгалтерией = Ошибка |

      ## Необязательные атрибуты
      Все атрибуты, описанные в запросе, **передаются всегда**. Если значение необязательного атрибута
      отсутствует, он передаётся со значением `null`.
      Например, для номенклатуры без категории передаётся `category: null`,
      для неархивной номенклатуры — `dateDel: null`.

      ## Endpoint
      **Склад на стороне ИС Заказчика:** endpoint указан в настройке
      Номенклатура -> Справочник Номенклатура сырья (в склад).

      **Склад на стороне ISF:**
      - endpoint для отправки в склад указан в настройке Номенклатура -> Справочник Номенклатура сырья (в склад),
        определён в системе как `[url АРМ Склад]/api/integrations/nomenclature/raw`;
      - endpoint для отправки в ИС Заказчика указан в настройке
        Номенклатура -> Справочник Номенклатура сырья (в бухгалтерию).

      ## Коды ошибок
      Бизнес-ошибки возвращаются с HTTP 200 и `success = false`.

      | Код | Описание | Условия возникновения |
      |-----|----------|-----------------------|
      | 020 | Архивация номенклатуры невозможна | В рамках производственной номенклатуры существует товарная номенклатура в статусе <> Архив |
    tags:
      - НСИ. Номенклатура
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/rawNomenclatureRequest'
          examples:
            approve:
              summary: Утверждение номенклатуры сырья
              description: Все атрибуты заполнены; `dateDel` передаётся как `null`.
              value:
                product:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  article: С-000123
                  name: Мука пшеничная высшего сорта
                  unit: KGM
                  isMercury: false
                  isInActive: false
                  category:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    name: Мука и крупы
                  origin: Растительное
                  expireControl: true
                  dateIns: "2026-09-01T09:15:30+03:00"
                  dateUpd: "2026-09-08T15:37:12+03:00"
                  dateDel: null
            withoutCategory:
              summary: Номенклатура сырья без категории
              description: Необязательный объект `category` не заполнен и передаётся как `null`.
              value:
                product:
                  id: 5d2b7f3a-9c1e-4b8d-a6f0-2e4c6a8b0d13
                  article: С-000789
                  name: Соль поваренная пищевая
                  unit: KGM
                  isMercury: false
                  isInActive: false
                  category: null
                  origin: Другое
                  expireControl: false
                  dateIns: "2026-09-10T12:00:00+03:00"
                  dateUpd: "2026-09-10T12:00:00+03:00"
                  dateDel: null
            archiving:
              summary: Архивация номенклатуры сырья (кнопка «В архив»)
              value:
                product:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  article: С-000123
                  name: Мука пшеничная высшего сорта
                  unit: KGM
                  isMercury: false
                  isInActive: true
                  category:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    name: Мука и крупы
                  origin: Растительное
                  expireControl: true
                  dateIns: "2026-09-01T09:15:30+03:00"
                  dateUpd: "2026-09-21T10:05:00+03:00"
                  dateDel: "2026-09-21T10:05:00+03:00"
    responses:
      '200':
        description: |
          Результат обработки (успешный или неуспешный).
          `id` — идентификатор номенклатуры, полученный в запросе; не возвращается, если код ошибки 4XX.
        content:
          application/json:
            schema:
              $ref: '../components/errorResponse.yaml'
            examples:
              success:
                summary: Успешная обработка
                value:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  success: true
                  error: null
              archiveImpossible:
                summary: Архивация невозможна — есть неархивная товарная номенклатура
                value:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  success: false
                  error:
                    - code: "020"
                      description: Архивация номенклатуры невозможна
components:
  schemas:
    rawNomenclatureRequest:
      type: object
      description: Тело запроса на отправку номенклатуры сырья.
      required:
        - product
      properties:
        product:
          $ref: "#/components/schemas/product"

    product:
      type: object
      description: |
        Номенклатура сырья.
        Все атрибуты передаются всегда; необязательные атрибуты без значения передаются со значением `null`.
      required:
        - id
        - article
        - name
        - unit
        - isMercury
        - isInActive
        - category
        - origin
        - expireControl
        - dateIns
        - dateUpd
        - dateDel
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор номенклатуры.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: поле guid записи номенклатуры.
        article:
          type: string
          description: Артикул.
          example: С-000123
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Артикул.
        name:
          type: string
          description: Наименование.
          example: Мука пшеничная высшего сорта
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Наименование.
        unit:
          type: string
          description: |
            Единица измерения. Значение из ОКЕИ
            (Общероссийский классификатор единиц измерения):
            - `KGM` — килограмм
            - `PCE` — штука
            - `LTR` — литр
            - `MTR` — метр
            - `GRM` — грамм
          enum:
            - KGM
            - PCE
            - LTR
            - MTR
            - GRM
          example: KGM
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
        isMercury:
          type: boolean
          description: "`true`, если продукция подотчётна Меркурию."
          example: false
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Подотчётная Меркурию продукция.
        isInActive: 
          type: boolean
          description: |
            Признак архивации.
            - При отправке сообщения по кнопке «Утвердить» — `isInActive = false`.
            - При отправке сообщения по кнопке «В архив» — `isInActive = true`.
            - При отправке сообщения после приёма номенклатуры СиМ — значение, установленное при приёме.
          example: false
        category:
          $ref: "#/components/schemas/category"
        origin:
          type: string
          description: Происхождение.
          enum:
            - Растительное
            - Животное
            - Комбинированное
            - Другое
          example: Растительное
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Происхождение.
        expireControl:
          type: boolean
          description: Контролировать срок годности.
          example: true
          # Источник — сущность: Номенклатура сырья, общая часть карточки.
          # Источник — атрибут: Контролировать срок годности.
        dateIns:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата создания записи. Строка в текстовом формате RFC 3339.
            Необязательный: при отсутствии значения передаётся `null`.
          example: "2026-09-01T09:15:30+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
          # Источник — атрибут: Дата создания записи.
        dateUpd:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата последнего изменения, инициировавшего обмен.
            Строка в текстовом формате RFC 3339.
            Необязательный: при отсутствии значения передаётся `null`.
          example: "2026-09-08T15:37:12+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
        dateDel:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата удаления записи. Строка в текстовом формате RFC 3339.
            Для неархивной номенклатуры (`isInActive = false`) передаётся `null`.
          example: "2026-09-21T10:05:00+03:00"
          # Источник — сущность: Лог изменений номенклатуры сырья.
          # Источник — атрибут: Дата удаления записи.

    category:
      type: object
      nullable: true
      description: |
        Категория. Необязательный объект: при отсутствии значения передаётся `null`;
        если объект заполнен, то `id` и `name` обязательны.
      # Источник — сущность: Номенклатура сырья, общая часть карточки.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор категории.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          # Источник — идентификатор справочника «Категории сырья».
        name:
          type: string
          description: Наименование категории.
          example: Мука и крупы
          # Источник — наименование справочника «Категории сырья».
